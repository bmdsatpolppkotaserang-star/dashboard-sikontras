<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15803d">  
  <title>DASHBOARD SIKONTRAS</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #15803d;
      --primary-light: #f0fdf4;
      --dark: #0f172a;
      --slate: #475569;
      --border: #e2e8f0;
      --bg: #f1f5f9;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }
    
    * { 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background: var(--bg); 
      margin: 0; 
      padding: 12px; 
      color: var(--dark); 
    }
    
    .container { 
      max-width: 600px; 
      margin: 0 auto; 
    }
    
    /* HEADER MOBILE FRIENDLY */
    .header-card { 
      background: white; 
      padding: 16px; 
      border-radius: 16px; 
      box-shadow: var(--shadow); 
      margin-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 12px; 
    }
    .header-card h2 { 
      margin: 0; 
      font-size: 17px; 
      font-weight: 800;
      color: var(--primary); 
    }
    
    .btn-refresh { 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 10px 14px; 
      border-radius: 10px; 
      font-weight: 700; 
      font-size: 13px;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      box-shadow: 0 4px 10px rgba(21, 128, 61, 0.2);
      flex-shrink: 0;
    }
    .btn-refresh:active { transform: scale(0.96); }

    /* STATS & REKAP GRID */
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
      margin-bottom: 12px; 
    }
    .stat-card { 
      background: white; 
      padding: 14px; 
      border-radius: 12px; 
      box-shadow: var(--shadow); 
      border-left: 4px solid var(--primary); 
    }
    .stat-card.full-width {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-card h4 { 
      margin: 0; 
      font-size: 10px; 
      color: var(--slate); 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      font-weight: 700;
    }
    .stat-card p { 
      margin: 6px 0 0 0; 
      font-size: 20px; 
      font-weight: 800; 
      color: var(--dark); 
    }
    
    /* CONTENT CARD & MOBILE CARD LIST */
    .content-card { 
      background: white; 
      padding: 16px; 
      border-radius: 16px; 
      box-shadow: var(--shadow); 
      margin-bottom: 20px; 
    }
    
    .section-title {
      margin: 0 0 12px 0; 
      font-size: 14px; 
      font-weight: 700;
      color: var(--dark);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* FORMAT LIST KARTU URUTAN ATAS KE BAWAH */
    .abnormal-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .abnormal-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Baris 1: Tanggal & Waktu */
    .card-row-time {
      font-size: 12px;
      color: var(--slate);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Baris 2: Penempatan (Pos Jaga & Pleton) */
    .card-row-pos {
      font-size: 13px;
      font-weight: 700;
      color: var(--dark);
    }

    /* Baris 3: Nama Anggota */
    .card-row-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
    }

    /* Baris 4: Status Kehadiran */
    .card-row-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Baris 5: Keterangan */
    .card-row-ket {
      font-size: 12px;
      color: var(--slate);
      background: white;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center; 
      padding: 30px 15px; 
      color: #166534; 
      font-weight: 600; 
      font-size: 13px;
      background: var(--primary-light);
      border-radius: 12px;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header-card">
    <div>
      <h2>SIKONTRAS</h2>
      <p style="margin:2px 0 0 0; font-size:11px; color:var(--slate); font-weight:600;">Dashboard Monitoring Anggota</p>
    </div>
    <button class="btn-refresh" onclick="muatDataDashboard()">🔄 Refresh</button>
  </div>

  <!-- KOTAK STATISTIK & REKAP -->
  <div class="stats-grid">
    <div class="stat-card full-width" style="border-left-color: #ef4444;">
      <div>
        <h4>Total Temuan Kendala</h4>
        <p id="statTotalTemuan" style="font-size: 24px;">0</p>
      </div>
      <div style="font-size: 28px;">📊</div>
    </div>
    
    <div class="stat-card" style="border-left-color: #f59e0b;">
      <h4>Terlambat</h4>
      <p id="statTerlambat">0</p>
    </div>
    
    <div class="stat-card" style="border-left-color: #f97316;">
      <h4>Luar Pos</h4>
      <p id="statLuarPos">0</p>
    </div>
    
    <div class="stat-card" style="border-left-color: #ef4444;">
      <h4>Sakit</h4>
      <p id="statSakit">0</p>
    </div>
    
    <div class="stat-card" style="border-left-color: #0284c7;">
      <h4>Izin / Cuti / TK</h4>
      <p id="statLainnya">0</p>
    </div>
  </div>

  <!-- DAFTAR KARTU RINCIAN -->
  <div class="content-card">
    <h3 class="section-title">Rincian Ketidakhadiran</h3>
    
    <div id="containerAbnormal" class="abnormal-list">
      <div class="empty-state">Memuat data rekapitulasi...</div>
    </div>
  </div>
</div>

<script>
  const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwvXrMvpq5a7thD8htTI6Yik0FMd_ynWgP_uIVVtLMuDBlHt9mK7vSrdiYyLkjqZMBp2A/exec";

  window.onload = function() {
    muatDataDashboard();
    daftarServiceWorker();
  };

  function daftarServiceWorker() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error('Service Worker Gagal:', err));
    }
  }

  function bersihkanFormatTanggal(rawWaktu) {
    if (!rawWaktu) return '-';
    let strWaktu = String(rawWaktu);
    if (strWaktu.includes("GMT") || strWaktu.includes("1899") || strWaktu.length > 20) {
      try {
        let d = new Date(strWaktu);
        if (!isNaN(d.getTime())) {
          let tgl = String(d.getDate()).padStart(2, '0');
          let bln = String(d.getMonth() + 1).padStart(2, '0');
          let thn = d.getFullYear();
          if (thn > 2000) return `${thn}-${bln}-${tgl}`;
        }
      } catch(e) {}
      return strWaktu.substring(0, 10);
    }
    return strWaktu;
  }

  function muatDataDashboard() {
    const container = document.getElementById('containerAbnormal');
    container.innerHTML = `<div class="empty-state" style="background:white; color:var(--slate);">⏳ Memperbarui data dari server...</div>`;

    fetch(URL_WEB_APP + "?action=getDataDashboard")
      .then(res => res.json())
      .then(res => {
        if(res.status === "SUCCESS") {
          container.innerHTML = "";
          
          let countTerlambat = 0;
          let countLuarPos = 0;
          let countSakit = 0;
          let countLainnya = 0;
          let totalTemuanCount = 0;
          let htmlCards = "";
          
          if(res.logs && res.logs.length > 0) {
            res.logs.forEach(row => {
              if (row.detailAbsensi && Array.isArray(row.detailAbsensi)) {
                let tanggalBersih = bersihkanFormatTanggal(row.waktu);

                row.detailAbsensi.forEach(ang => {
                  if (ang.status && ang.status.toLowerCase() !== "hadir") {
                    totalTemuanCount++;
                    
                    let statusLower = ang.status.toLowerCase();
                    let warnaBadge = "#f59e0b";
                    
                    if (statusLower.includes("terlambat")) {
                      countTerlambat++;
                      warnaBadge = "#f59e0b";
                    } else if (statusLower.includes("luar pos") || statusLower.includes("meninggalkan")) {
                      countLuarPos++;
                      warnaBadge = "#f97316";
                    } else if (statusLower.includes("sakit")) {
                      countSakit++;
                      warnaBadge = "#ef4444";
                    } else {
                      countLainnya++;
                      warnaBadge = "#0284c7";
                    }

                    // TAMPILAN URUT DARI ATAS KE BAWAH:
                    // 1. Tanggal Waktu
                    // 2. Penempatan
                    // 3. Nama Anggota
                    // 4. Status Kehadiran
                    // 5. Keterangan
                    htmlCards += `
                      <div class="abnormal-item">
                        <div class="card-row-time">
                          <span>📅 <b>${tanggalBersih}</b></span>
                          <span style="color:var(--primary); font-weight:700;">⏰ ${row.jamPatroli || '-'}</span>
                        </div>
                        
                        <div class="card-row-pos">
                          📍 ${row.pos} <span style="font-size:11px; color:var(--slate); font-weight:normal;">(${row.pleton} - ${row.danton})</span>
                        </div>
                        
                        <div class="card-row-name">
                          👤 ${ang.nama}
                        </div>
                        
                        <div class="card-row-status">
                          <span style="font-size:11px; color:var(--slate); font-weight:700;">STATUS:</span>
                          <span class="badge-status" style="background:${warnaBadge}15; color:${warnaBadge};">${ang.status}</span>
                        </div>
                        
                        ${ang.keterangan ? `<div class="card-row-ket">💬 <b>Ket:</b> <i>${ang.keterangan}</i></div>` : ''}
                      </div>
                    `;
                  }
                });
              }
            });
          }
          
          document.getElementById('statTotalTemuan').innerText = totalTemuanCount;
          document.getElementById('statTerlambat').innerText = countTerlambat;
          document.getElementById('statLuarPos').innerText = countLuarPos;
          document.getElementById('statSakit').innerText = countSakit;
          document.getElementById('statLainnya').innerText = countLainnya;
          
          if (htmlCards !== "") {
            container.innerHTML = htmlCards;
          } else {
            container.innerHTML = `<div class="empty-state">🎉 Nihil! Semua anggota tercatat hadir lengkap di pos pengontrolan.</div>`;
          }
        }
      })
      .catch(err => {
        console.error("Gagal memuat data:", err);
        container.innerHTML = `<div class="empty-state" style="background:#fef2f2; color:#ef4444; border-color:#fecaca;">❌ Gagal terhubung ke server. Periksa koneksi internet Anda.</div>`;
      });
  }
</script>

</body>
</html>
